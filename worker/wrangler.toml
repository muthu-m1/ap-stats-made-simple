# The shared tutor Worker. Deploy with `npx wrangler deploy`. It answers with Workers AI, using the free
# daily allowance of the Cloudflare account it's deployed to; on the Workers Free plan it can't run up a bill.
name = "ap-stats-tutor"
main = "src/index.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[vars]
# Only pages from these sites may use the tutor.
ALLOWED_ORIGINS = "https://muthu-m1.github.io"

# Each visitor (one open page) can ask 6 questions a minute.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "2701"

  [ratelimits.simple]
  limit = 6
  period = 60

# Everyone together can ask 60 questions a minute (counted per Cloudflare location).
[[ratelimits]]
name = "GLOBAL"
namespace_id = "2702"

  [ratelimits.simple]
  limit = 60
  period = 60
